name: Redeploy blog on Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: redeploy-blog-production
  cancel-in-progress: true

jobs:
  redeploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_SERVICE_NAME: yt-blog
    steps:
      - name: Redeploy Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing required secret: RAILWAY_TOKEN"
            exit 1
          fi

          railway redeploy \
            --service "$RAILWAY_SERVICE_NAME" \
            --yes
