name: Notify blog deploy

on:
  push:
    branches:
      - main
    paths:
      - content/**
      - media/**
      - .github/workflows/redeploy-blog.yml
  workflow_dispatch:

concurrency:
  group: notify-blog-production-deploy
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog deploy workflow
        env:
          GH_TOKEN: ${{ secrets.BLOG_REPO_DISPATCH_TOKEN }}
          BLOG_REPOSITORY: ytvee/yt-blog
          POSTS_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing required secret: BLOG_REPO_DISPATCH_TOKEN"
            exit 1
          fi

          gh api "repos/$BLOG_REPOSITORY/dispatches" \
            --method POST \
            --field event_type=posts_updated \
            --field client_payload[posts_sha]="$POSTS_SHA" \
            --field client_payload[source_repository]="$GITHUB_REPOSITORY"
