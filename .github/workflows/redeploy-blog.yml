name: Redeploy blog on Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: redeploy-blog-production
  cancel-in-progress: true

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment: env
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Missing required GitHub Actions secret: VERCEL_DEPLOY_HOOK_URL"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            "$VERCEL_DEPLOY_HOOK_URL"
